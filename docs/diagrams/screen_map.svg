<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2456d6"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
      <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a855f7"/></marker>
  </defs>
  <rect width="1040" height="640" fill="#f8fafc"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#0f172a">fishin: the five screens and how they connect</text>
  <text x="30" y="60" font-size="12" fill="#475569">The fish logo (top) always returns to Recommended. Bottom bar: My spot · Explore · Profile.</text>

  <!-- phone template helper via repeated groups -->
  <!-- 1 Recommended -->
  <g transform="translate(30,90)">
    <rect width="176" height="400" rx="20" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="88" y="24" text-anchor="middle" font-size="16">🐟</text>
    <text x="88" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">RECOMMENDED</text>
    <text x="12" y="78" font-size="10" font-weight="700" fill="#475569">Saved Spots</text>
    <rect x="12" y="86" width="152" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="20" y="104" font-size="10" fill="#1e293b">Lake Monona · 3 mi</text><text x="20" y="120" font-size="9" fill="#065f46">Walleye ✓ Pike ✓</text>
    <text x="12" y="156" font-size="10" font-weight="700" fill="#475569">Recommended Spots</text>
    <rect x="12" y="164" width="152" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="20" y="182" font-size="10" fill="#1e293b">Pelican Lake · 28 mi</text><text x="20" y="198" font-size="9" fill="#065f46">In range now</text>
    <rect x="12" y="218" width="152" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="20" y="236" font-size="10" fill="#1e293b">Law Park · 1 mi</text><text x="20" y="252" font-size="9" fill="#065f46">In range now</text>
    <text x="12" y="290" font-size="9" fill="#475569">Ranked on your device.</text>
    <text x="12" y="303" font-size="9" fill="#475569">Not a catch prediction.</text>
    <rect x="0" y="352" width="176" height="48" fill="#f1f5f9"/>
    <text x="30" y="382" font-size="16">☰</text><text x="82" y="382" font-size="18">📍</text><text x="134" y="382" font-size="16">👤</text>
  </g>
  <!-- 2 Explore -->
  <g transform="translate(250,90)">
    <rect width="176" height="400" rx="20" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="88" y="24" text-anchor="middle" font-size="16">🐟</text>
    <text x="88" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">EXPLORE</text>
    <rect x="12" y="64" width="152" height="24" rx="12" fill="#e2e8f0"/>
    <rect x="12" y="64" width="76" height="24" rx="12" fill="#2456d6"/>
    <text x="50" y="80" text-anchor="middle" font-size="10" fill="#fff">Map</text><text x="126" y="80" text-anchor="middle" font-size="10" fill="#475569">List</text>
    <rect x="12" y="98" width="152" height="24" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="20" y="114" font-size="10" fill="#475569">⚙ Filters</text>
    <rect x="12" y="130" width="152" height="150" rx="10" fill="#dbeafe"/>
    <circle cx="60" cy="180" r="5" fill="#0f6b4f"/><circle cx="110" cy="210" r="5" fill="#146c9e"/><circle cx="90" cy="240" r="5" fill="#7a5f00"/><circle cx="130" cy="160" r="5" fill="#0f6b4f"/>
    <text x="12" y="300" font-size="9" fill="#475569">List: Best match · Nearest · A–Z</text>
    <text x="12" y="314" font-size="9" fill="#475569">"Using your preferences" chip</text>
    <rect x="0" y="352" width="176" height="48" fill="#f1f5f9"/>
    <text x="30" y="382" font-size="16">☰</text><text x="82" y="382" font-size="18">📍</text><text x="134" y="382" font-size="16">👤</text>
  </g>
  <!-- 3 Spot -->
  <g transform="translate(470,90)">
    <rect width="176" height="400" rx="20" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="88" y="24" text-anchor="middle" font-size="16">🐟</text>
    <text x="88" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">SPOT</text>
    <text x="12" y="72" font-size="10" fill="#1e293b">Canoe Landing · Badfish Creek</text>
    <text x="12" y="88" font-size="9" fill="#475569">63°F water · 61°F ☀ · 3 mph N · 🌓</text>
    <rect x="12" y="98" width="152" height="82" rx="8" fill="#ecfdf5" stroke="#34d399"/>
    <text x="20" y="114" font-size="10" font-weight="700" fill="#065f46">Active fish</text>
    <text x="20" y="130" font-size="9" fill="#1e293b">Northern Pike · Walleye …</text>
    <text x="20" y="146" font-size="9" fill="#475569">picture · in documented window</text>
    <rect x="12" y="188" width="152" height="70" rx="8" fill="#fefce8" stroke="#facc15"/>
    <text x="20" y="204" font-size="10" font-weight="700" fill="#854d0e">Inactive fish</text>
    <text x="20" y="220" font-size="9" fill="#1e293b">Brook Trout · outside window</text>
    <rect x="12" y="266" width="152" height="20" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/><text x="20" y="280" font-size="9" fill="#1e293b">Stocking history</text>
    <rect x="12" y="290" width="152" height="20" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/><text x="20" y="304" font-size="9" fill="#1e293b">Regulations</text>
    <rect x="12" y="314" width="152" height="20" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/><text x="20" y="328" font-size="9" fill="#1e293b">Consumption advisory</text>
    <rect x="0" y="352" width="176" height="48" fill="#f1f5f9"/>
    <text x="30" y="382" font-size="16" fill="#2456d6">☰</text><text x="82" y="382" font-size="18">📍</text><text x="134" y="382" font-size="16">👤</text>
  </g>
  <!-- 4 Fish -->
  <g transform="translate(690,90)">
    <rect width="176" height="400" rx="20" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="88" y="24" text-anchor="middle" font-size="16">🐟</text>
    <text x="88" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">FISH</text>
    <text x="12" y="72" font-size="11" font-weight="700" fill="#1e293b">Walleye</text>
    <rect x="12" y="80" width="152" height="70" rx="8" fill="#e0e7ff"/><text x="88" y="120" text-anchor="middle" font-size="10" fill="#475569">public-domain photo</text>
    <text x="12" y="170" font-size="10" font-weight="700" fill="#475569">Documented activity</text>
    <text x="12" y="184" font-size="9" fill="#1e293b">55–75°F · sources shown</text>
    <text x="12" y="206" font-size="10" font-weight="700" fill="#475569">Documented habitat</text>
    <text x="12" y="220" font-size="9" fill="#1e293b">structure · depth · substrate</text>
    <text x="12" y="242" font-size="10" font-weight="700" fill="#475569">Recommended bait</text>
    <rect x="12" y="250" width="152" height="24" rx="6" fill="#f1f5f9"/><text x="20" y="266" font-size="9" fill="#1e293b">Leeches · how to use</text>
    <rect x="12" y="278" width="152" height="24" rx="6" fill="#f1f5f9"/><text x="20" y="294" font-size="9" fill="#1e293b">Nightcrawlers · how to use</text>
    <text x="12" y="322" font-size="9" fill="#2456d6">All documented baits →</text>
    <rect x="0" y="352" width="176" height="48" fill="#f1f5f9"/>
    <text x="30" y="382" font-size="16">☰</text><text x="82" y="382" font-size="18">📍</text><text x="134" y="382" font-size="16">👤</text>
  </g>
  <!-- 5 Profile -->
  <g transform="translate(30,520)">
    <rect width="836" height="90" rx="14" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="16" y="26" font-size="13" font-weight="700" fill="#6b21a8">👤 PROFILE (anonymous, stored only on the device)</text>
    <text x="16" y="48" font-size="11" fill="#1e293b">Theme: match device / light / dark · Boat launches, carry-ins, shore spots: Prefer / OK / Avoid · Travel distance · 27 species checklist</text>
    <text x="16" y="68" font-size="11" fill="#1e293b">Rate us · Help · Documentation.  These preferences reorder Recommended and Explore's Best match. They never hide a spot you searched for.</text>
  </g>

  <!-- flows -->
  <g stroke="#2456d6" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M206 250 C 228 250, 228 250, 250 250" stroke="#64748b" marker-end="url(#g)"/>
    <path d="M118 90 C 118 74, 558 74, 558 90"/>
    <path d="M426 250 H470"/>
    <path d="M646 250 H690"/>
  </g>
  <text x="338" y="88" text-anchor="middle" font-size="10" fill="#2456d6">tap a card → spot</text>
  <text x="432" y="243" font-size="10" fill="#2456d6">pin / card</text>
  <text x="648" y="243" font-size="10" fill="#2456d6">tap a fish</text>
  <path d="M690 300 C 668 330, 668 330, 646 300" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#g)" stroke-dasharray="4 3"/>
  <text x="654" y="336" font-size="9" fill="#64748b">back</text>
  <g stroke="#a855f7" stroke-width="2" fill="none" stroke-dasharray="5 4">
    <path d="M118 520 V492" marker-end="url(#p)"/>
    <path d="M338 520 V492" marker-end="url(#p)"/>
  </g>
  <text x="128" y="508" font-size="10" fill="#6b21a8">preferences reorder these lists</text>
</svg>
