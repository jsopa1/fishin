{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>

<div class="form-card">
  {% if error %}
  <div class="form-errors"><ul><li>{{ error }}</li></ul></div>
  {% endif %}
  <form method="post" action="{{ url_for('accounts.login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-field">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" name="email" required value="{{ email }}">
    </div>
    <div class="form-field">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>
</div>
<p class="form-switch">No account yet? <a href="{{ url_for('accounts.signup') }}">Create one</a>.</p>
{% endblock %}
