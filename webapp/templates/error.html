{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block here %}Error{% endblock %}
{% block content %}
<div class="empty-state" style="padding: var(--space-8) var(--space-6);">
  <svg class="icon icon-lg" aria-hidden="true" style="width:2em;height:2em;margin-bottom:var(--space-3);"><use href="#icon-alert-triangle"/></svg>
  <h1 style="margin: 0 0 var(--space-2); font-style: normal;">{{ code }}</h1>
  <p style="font-style: normal;">{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('home') }}" style="margin-top: var(--space-3);">
    <svg class="icon" aria-hidden="true"><use href="#icon-chevron-left"/></svg> Back to home
  </a>
</div>
{% endblock %}
