<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="fishin — Wisconsin fishing conditions, explained">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12336d"/>
      <stop offset="100%" stop-color="#2456d6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- Water bands -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3" stroke-linecap="round">
    <path d="M0 470c60-26 120-26 180 0s120 26 180 0 120-26 180 0 120 26 180 0 120-26 180 0 120 26 180 0"/>
    <path d="M0 524c60-26 120-26 180 0s120 26 180 0 120-26 180 0 120 26 180 0 120-26 180 0 120 26 180 0"/>
    <path d="M0 578c60-26 120-26 180 0s120 26 180 0 120-26 180 0 120 26 180 0 120-26 180 0 120 26 180 0"/>
  </g>

  <!-- Mark -->
  <g transform="translate(84 82)" fill="none" stroke="#8fd0ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 26c7-11 20-17 31-17 8 0 17 6 20 17-3 11-12 17-20 17-11 0-24-6-31-17z"/>
    <path d="M4 26L-2 15M4 26l-6 11M55 18v16"/>
    <circle cx="38" cy="21" r="2.6" fill="#8fd0ff" stroke="none"/>
  </g>
  <text x="160" y="118" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">fishin</text>

  <text x="84" y="240" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="#ffffff">Why they're biting,</text>
  <text x="84" y="316" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="#ffffff">not just where.</text>

  <text x="84" y="382" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#c9dcff">Live Wisconsin water temperatures checked against</text>
  <text x="84" y="424" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#c9dcff">published fish-physiology research.</text>

  <!-- Stat pills -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600">
    <rect x="84" y="470" width="270" height="58" rx="29" fill="#ffffff" fill-opacity="0.14"/>
    <text x="219" y="507" fill="#ffffff" text-anchor="middle">3,272 access points</text>

    <rect x="374" y="470" width="266" height="58" rx="29" fill="#ffffff" fill-opacity="0.14"/>
    <text x="507" y="507" fill="#ffffff" text-anchor="middle">2,296 waterbodies</text>

    <rect x="660" y="470" width="230" height="58" rx="29" fill="#ffffff" fill-opacity="0.14"/>
    <text x="775" y="507" fill="#ffffff" text-anchor="middle">26 species</text>
  </g>
</svg>
